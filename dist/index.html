:"A boundary can be unclear within one reading.","status":"proposed","scope":"Pilot explanatory relationship, subject to context and editorial review."},{"type":"can-produce","target":"uncertainty-01","note":"Borderline cases can leave someone unsure whether a label applies.","status":"proposed","scope":"Pilot explanatory relationship, subject to context and editorial review."}],"language":"en","scheme":"atlas-pilot-en","source_refs":["sep-vagueness","sep-ambiguity"],"preferred_expression":"vagueness-01-en","expressions":[{"id":"vagueness-01-en","language":"en","text":"Vagueness","script":"Latn","direction":"ltr","usage":"Borderline applicability","cultural_context":"English-language pilot; no claim of universality or cross-language identity.","source_refs":["sep-vagueness","sep-ambiguity"],"status":"draft"}]},{"id":"uncertainty-01","label":"Uncertainty","aliases":[],"sense":"A person’s unsettled confidence or epistemic position","definition":"Limited confidence or lack of settled knowledge about a claim, interpretation, or outcome.","recognition":"State what you are unsure about and what information could change that.","examples":["You understand a forecast but are unsure whether rain will occur."],"counterexamples":["A clearly understood question with a known answer does not create uncertainty merely by being complex."],"contexts":["Uncertainty depends on whose information and confidence are at issue, and can remain despite precise language."],"limits":"A pilot working definition, not a complete technical taxonomy. Felt confidence and epistemic warrant can come apart: someone can feel certain without adequate grounds. No probability measure is assumed.","status":"draft","provenance":{"kind":"original-editorial-draft","originator":"Anier Landon Woodyard","assistance":"AI-assisted drafting from founding discussion","review":"Compared with the listed sources using AI assistance; independent specialist review pending.","scope":"Definitions are original paraphrases or
